<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <!--文字コードをUTF-8に設定する-->
  <meta charset="UTF-8" />
  <!--ブラウザに表示されるタイトルを設定する-->
  <title>404</title>
</head>
<body>



<div th:replace="layout :: layout(~{::section})">
  <section>
    <!--見出しとエラーメッセージを表示する-->
    <h2>ページが見つかりません</h2>
    <p>指定されたタスクが存在しない可能性があります。</p>
    <!--タスクの一覧ページへ戻る-->
    <p><a th:href="@{/tasks}">一覧へ戻る</a></p>
  </section>
</div>

</body>
</html>
