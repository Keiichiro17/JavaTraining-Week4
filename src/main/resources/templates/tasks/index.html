<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="layout :: layout(~{::section})">
  <section>
    <!-- 画面のタイトル-->
    <h2>タスク一覧</h2>
<!-- タスクの新規作成ページへのリンク -->
    <p><a th:href="@{/tasks/new}">新規作成</a></p>
<!-- タスクの一覧をテーブルで表示 -->
    <table border="1" cellpadding="6">

      
      <thead>
      <tr>
        <th>ID</th>
        <th>タイトル</th>
        <th>完了</th>
        <th>操作</th>
      </tr>
      </thead>

      <tbody>
      <tr th:each="t : ${tasks}">
        <!-- タスクのID、タイトル、完了状態を表示 -->
        <td th:text="${t.id}">1</td>
        <td th:text="${t.title}">title</td>
        <td th:text="${t.completed} ? '完了' : '未完了'">未完了</td>
        <td>
          <a th:href="@{/tasks/{id}/edit(id=${t.id})}">編集</a>
<!-- タスクの削除と完了切替のフォーム -->
          <form th:action="@{/tasks/{id}/delete(id=${t.id})}" method="post" style="display:inline;">
            <button type="submit">削除</button>
          </form>

          <form th:action="@{/tasks/{id}/toggle(id=${t.id})}" method="post" style="display:inline;">
            <button type="submit">完了切替</button>
          </form>
        </td>
      </tr>

      <!-- タスクがない場合のメッセージ -->
      <tr th:if="${#lists.isEmpty(tasks)}">
        <td colspan="4">タスクがありません</td>
      </tr>
      </tbody>
    </table>
  </section>
</div>
</body>
</html>
