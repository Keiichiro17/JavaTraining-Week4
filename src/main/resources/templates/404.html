<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <!--文字コードをUTF-8に設定する-->
  <meta charset="UTF-8" />
  <!--ページのタイトルを設定する-->
  <title>404</title>
</head>
<body>
<div th:replace="layout :: content">
  <!--見出しとエラーメッセージを表示する-->
  <h2>ページが見つかりません</h2>
  <p>指定されたタスクが存在しない可能性があります。</p>
  <!--タスクの一覧ページへのリンクへ戻る-->
  <p><a class="btn" th:href="@{/tasks}">一覧へ戻る</a></p>
</div>
</body>
</html>
